---
name: Build a lean Super-Linter image
description: >-
  Generate a Super-Linter image with only the linters a repository enables
  (VALIDATE_* flags), build it and smoke-test it. Pushing it, scanning it and
  recording its tag stay with the calling workflow, so the action needs no
  secrets.

inputs:
  upstream-tag:
    description: Super-Linter release the image is built from, for example v9.0.0
    required: true
  env-files:
    description: >-
      Env files with the VALIDATE_* flags, one path per line. Later files
      override earlier ones.
    required: false
    default: .github/super-linter.env
  image:
    description: Local name of the built image
    required: false
    default: lintsmith:candidate
  revision:
    description: Commit the image is built for (becomes BUILD_REVISION)
    required: false
    default: ${{ github.sha }}
  smoke:
    description: Smoke-test the image against upstream's fixtures (true or false)
    required: false
    default: "true"

outputs:
  image:
    description: Name of the built image in the local Docker daemon
    value: ${{ inputs.image }}
  context:
    description: Directory with the generated Dockerfile, checks.sh and plan.json
    value: ${{ steps.generate.outputs.context }}
  plan:
    description: Path of the generated plan.json (flags, baseline image)
    value: ${{ steps.generate.outputs.context }}/plan.json

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false

    - name: Fetch the upstream Dockerfile and test fixtures
      id: upstream
      shell: bash
      env:
        UPSTREAM_TAG: ${{ inputs.upstream-tag }}
      run: |
        upstream="${RUNNER_TEMP}/lintsmith-upstream"
        rm -rf "${upstream}"
        git clone --quiet --depth 1 --branch "${UPSTREAM_TAG}" --filter=blob:none --sparse \
          https://github.com/super-linter/super-linter "${upstream}"
        git -C "${upstream}" sparse-checkout set --no-cone '/Dockerfile' '/.editorconfig' '/.github/linters/' '/test/linters/'
        echo "path=${upstream}" >> "${GITHUB_OUTPUT}"

    - name: Generate the build context
      id: generate
      shell: bash
      env:
        UPSTREAM_TAG: ${{ inputs.upstream-tag }}
        ENV_FILES: ${{ inputs.env-files }}
        UPSTREAM: ${{ steps.upstream.outputs.path }}
        # the action is unpacked without .git, so hatch-vcs cannot read a version from tags
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
      run: |
        context="${RUNNER_TEMP}/lintsmith-build"
        args=()
        while IFS= read -r file; do
          if [ -n "${file}" ]; then args+=(--env "${file}"); fi
        done <<< "${ENV_FILES}"
        uv run --project "${GITHUB_ACTION_PATH}" lintsmith generate "${args[@]}" \
          --upstream-tag "${UPSTREAM_TAG}" \
          --upstream-dockerfile "${UPSTREAM}/Dockerfile" \
          --out "${context}"
        echo "context=${context}" >> "${GITHUB_OUTPUT}"
        jq -r '"Flags: " + (.flags | join(" "))' "${context}/plan.json" >> "${GITHUB_STEP_SUMMARY}"

    - name: Build the image
      shell: bash
      env:
        UPSTREAM_TAG: ${{ inputs.upstream-tag }}
        IMAGE: ${{ inputs.image }}
        REVISION: ${{ inputs.revision }}
        CONTEXT: ${{ steps.generate.outputs.context }}
      run: |
        docker build "${CONTEXT}" \
          --build-arg "BUILD_REVISION=${REVISION}" \
          --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --label "io.lintsmith.upstream-tag=${UPSTREAM_TAG}" \
          --tag "${IMAGE}"

    - name: Smoke-test the image
      if: ${{ inputs.smoke == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CONTEXT: ${{ steps.generate.outputs.context }}
        UPSTREAM: ${{ steps.upstream.outputs.path }}
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
      run: |
        status=0
        uv run --project "${GITHUB_ACTION_PATH}" lintsmith smoke \
          "${IMAGE}" "${CONTEXT}/plan.json" "${UPSTREAM}" --jobs 4 > "${RUNNER_TEMP}/smoke.md" || status=$?
        cat "${RUNNER_TEMP}/smoke.md"
        { echo "### Smoke test"; echo; cat "${RUNNER_TEMP}/smoke.md"; } >> "${GITHUB_STEP_SUMMARY}"
        exit "${status}"
