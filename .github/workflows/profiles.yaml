---
name: Toolchain benchmark

# For each stack profile: generate a lean image from its VALIDATE_* flags,
# push it (gzip and zstd layers) to GHCR, verify every tool runs, then measure
# cold and warm pulls against the upstream baseline image.
#
# Runs on ubuntu-latest by default. To use your own runner, set the RUNNER_LABELS
# repository variable (for example ["self-hosted", "linux"]) or pass runner_labels.
# Needs on that runner: docker with
# buildx, uv (installed by the workflow), jq, curl, git.

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream Super-Linter release tag
        default: v9.0.0
        required: true
      profiles:
        description: Comma-separated profile names, or "all"
        default: all
        required: true
      runs:
        description: Pulls per image and mode
        default: "3"
        required: true
      split_download:
        description: Also measure the download vs unpack split (about 3x slower)
        type: boolean
        default: false
      runner_labels:
        description: JSON array of runner labels (default - the RUNNER_LABELS repository variable, else ubuntu-latest)
        default: ""
        required: false
  # Called by the release workflow, which only runs when the pinned upstream
  # version changes. There is no schedule or push trigger on purpose: benchmarks
  # run on a new upstream version or when someone starts them by hand.
  workflow_call:
    inputs:
      upstream_tag:
        type: string
        required: true
      profiles:
        type: string
        default: all
      runs:
        type: string
        default: "3"
      split_download:
        type: boolean
        default: false
      runner_labels:
        type: string
        default: ""

permissions: {}

jobs:
  plan:
    permissions:
      contents: read
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: m
        env:
          PROFILES: ${{ inputs.profiles }}
        run: |
          all="base-only ghwm python java dotnet rust c-cpp frontend-vanilla frontend-react frontend-vue frontend-angular frontend-svelte"
          if [ "$PROFILES" = "all" ]; then list="$all"; else list="${PROFILES//,/ }"; fi
          json="$(
            for p in $list; do
              # Toolchains are examples: opinionated base + one stack. The ghwm
              # example is a real repo's exact flags, without the base.
              envs="base/opinionated.env toolchains/$p.env"
              [ "$p" = "ghwm" ] && envs="examples/ghwm.env"
              # Every mapped linter at once: verifies the whole mapping.
              [ "$p" = "all-linters" ] && envs="ALL"
              # Extras: tools Super-Linter does not ship (apk, npm, pip).
              [ "$p" = "extras-example" ] && envs="base/opinionated.env examples/with-extras.env"
              [ "$envs" = "ALL" ] || for f in $envs; do test -f "$f" || { echo "::error::missing $f" >&2; exit 1; }; done
              jq -nc --arg p "$p" --arg e "$envs" '{profile: $p, envs: $e}'
            done | jq -sc .
          )"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  profile:
    name: ${{ matrix.profile }}
    needs: plan
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      # One at a time: the benchmark must not compete with itself for the
      # network and disk of a single runner.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PROFILE: ${{ matrix.profile }}
      ENVS: ${{ matrix.envs }}
      TAG: ${{ inputs.upstream_tag }}
      RUNS: ${{ inputs.runs }}
      BENCH_SPLIT: ${{ inputs.split_download && '1' || '0' }}
    steps:
      # The runner VM has a small disk and the standard upstream image is
      # large, so start every profile from a clean Docker state.
      - name: Free disk before build
        run: |
          df -h / | tail -1
          docker system prune -af --volumes >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          echo "free after cleanup: $(df -h / | awk 'NR==2{print $4}')"
          [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 25 ] \
            || echo "::warning::less than 25 GB free; large profiles (dotnet) may fail"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: super-linter/super-linter
          ref: ${{ inputs.upstream_tag }}
          path: upstream
          sparse-checkout: |
            /Dockerfile
            /.editorconfig
            /.github/linters/
            /test/linters/
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Generate build context
        run: |
          args=()
          if [ "$ENVS" = "ALL" ]; then args=(--all); else for e in $ENVS; do args+=(--env "$e"); done; fi
          uv run lintsmith generate "${args[@]}" \
            --upstream-tag "$TAG" --upstream-dockerfile upstream/Dockerfile --out build
          {
            echo "BASELINE_IMAGE=$(jq -r .baseline_image build/plan.json)"
            echo "LEAN_BASE=ghcr.io/${GITHUB_REPOSITORY,,}/lean-${PROFILE}"
          } >> "$GITHUB_ENV"
          {
            echo "### ${PROFILE}"
            echo "Baseline: \`$(jq -r .baseline_image build/plan.json)\`"
            echo
            echo "npm packages kept (roots): $(jq -r '.npm_roots | length' build/plan.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push (gzip and zstd layers)
        run: |
          rm -f "build-${PROFILE}.jsonl"
          for c in gzip zstd; do
            t0=$(date +%s.%N)
            docker buildx build build \
              --provenance=false --sbom=false \
              --metadata-file "${RUNNER_TEMP}/metadata-${c}.json" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "io.lintsmith.upstream-tag=${TAG}" \
              --label "io.lintsmith.profile=${PROFILE}" \
              --output "type=image,name=${LEAN_BASE}:${TAG}-${c},push=true,oci-mediatypes=true,compression=${c},force-compression=true"
            t1=$(date +%s.%N)
            jq -nc --arg v "${PROFILE}/lean-${c}" --argjson s "$(awk -v a="$t0" -v b="$t1" 'BEGIN{printf "%.1f", b-a}')" \
              '{variant:$v, mode:"build", pull_s:$s}' >> "build-${PROFILE}.jsonl"
          done

      # Signing happens after the timed builds. The signature is a separate
      # artifact next to the image, so the pulls that are benchmarked do not change.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the images (keyless)
        run: |
          for c in gzip zstd; do
            cosign sign --yes "${LEAN_BASE}@$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata-${c}.json")"
          done

      # Optional: enables the download vs unpack split. Failure is tolerated.
      - name: Install crane
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" crane
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify every tool runs in the lean image
        run: |
          docker pull --quiet "${LEAN_BASE}:${TAG}-gzip" >/dev/null
          docker run --rm -v "$PWD/build/checks.sh:/checks.sh:ro" --entrypoint bash \
            "${LEAN_BASE}:${TAG}-gzip" /checks.sh 2>&1 | tee "checks-${PROFILE}.log"
          if grep -qE '^FAIL' "checks-${PROFILE}.log"; then
            grep -E '^FAIL' "checks-${PROFILE}.log" | while read -r l; do echo "::error title=${PROFILE} tool check::$l"; done
            exit 1
          fi

      - name: Smoke-test the lean image
        run: |
          status=0
          uv run --no-dev lintsmith smoke "${LEAN_BASE}:${TAG}-gzip" build/plan.json upstream --jobs 4 > "smoke-${PROFILE}.md" || status=$?
          {
            echo "### Smoke test: ${PROFILE}"
            echo
            cat "smoke-${PROFILE}.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Benchmark pulls
        if: always()
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          out="bench-${PROFILE}.jsonl"
          rm -f "$out"
          measure() { # image kind mode
            uv run --no-dev lintsmith bench "$1" "$RUNS" "${PROFILE}/$2" "$RUNNER_ENVIRONMENT" \
              --mode "$3" --out "$out" || echo "::warning::benchmark failed: $2 ($3)"
          }
          for mode in cold warm; do
            measure "$BASELINE_IMAGE" baseline "$mode"
            measure "${LEAN_BASE}:${TAG}-gzip" lean-gzip "$mode"
            measure "${LEAN_BASE}:${TAG}-zstd" lean-zstd "$mode"
          done
          # Bracket: pull the baseline cold again at the end. If it differs a
          # lot from the first reading, the network drifted during this job.
          RUNS=2 measure "$BASELINE_IMAGE" baseline-end cold

      - name: Keep plan and Dockerfile per profile
        if: always()
        run: |
          cp build/plan.json "plan-${PROFILE}.json" || true
          cp build/Dockerfile "Dockerfile-${PROFILE}" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile-${{ matrix.profile }}
          path: |
            bench-${{ matrix.profile }}.jsonl
            build-${{ matrix.profile }}.jsonl
            checks-${{ matrix.profile }}.log
            plan-${{ matrix.profile }}.json
            Dockerfile-${{ matrix.profile }}

      - name: Free disk
        if: always()
        run: |
          docker image rm -f "${LEAN_BASE}:${TAG}-gzip" "${LEAN_BASE}:${TAG}-zstd" >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true

  summary:
    needs: profile
    if: always()
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: write
    env:
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: profile-*
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # The branch switch below removes the checkout, so install the tool rather than run it from here
      - name: Install lintsmith
        run: |
          uv tool install --quiet .
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Compare lean against baseline
        run: |
          {
            echo "## Lean vs upstream baseline (upstream ${UPSTREAM_TAG})"
            echo
            lintsmith compare bench-*.jsonl build-*.jsonl
          } | tee results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: |
            results.md
            bench-*.jsonl

      # Keep a readable history of runs in the repo, on a separate branch.
      - name: Publish results to the bench-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out"
          cp results.md bench-*.jsonl build-*.jsonl checks-*.log plan-*.json "$RUNNER_TEMP/out/"
          git fetch origin bench-results || true
          if git rev-parse --verify origin/bench-results >/dev/null 2>&1; then
            git checkout -q -B bench-results origin/bench-results
          else
            git checkout -q --orphan bench-results
            git rm -rfq . || true
          fi
          dir="results/$(date -u +%Y-%m-%d)-run-${GITHUB_RUN_ID}"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP"/out/* "$dir/"
          # Latest numbers per upstream tag, merged over several runs. The
          # release workflow compares these between two tags.
          bytag="results/by-tag/${UPSTREAM_TAG}"
          mkdir -p "$bytag"
          cp "$RUNNER_TEMP"/out/* "$bytag/"
          rm -f "$bytag/results.md"
          { echo "## Lean vs upstream baseline (upstream ${UPSTREAM_TAG})"; echo
            lintsmith compare "$bytag"/bench-*.jsonl "$bytag"/build-*.jsonl 2>/dev/null; } > "$bytag/results.md" || true
          git add results
          git commit -q -m "Benchmark results: run ${GITHUB_RUN_ID} (upstream ${UPSTREAM_TAG})"
          # the checkout keeps no credentials; give git the token for this push only
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin bench-results
