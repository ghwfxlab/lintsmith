---
name: Publish Super-Linter image

# Builds this repository's own lean Super-Linter image from
# .github/super-linter.env with lintsmith and pushes it to GHCR. The
# super-linter workflow (2.x) runs it when SUPER_LINTER_CUSTOM is true.
#
#   ghcr.io/<owner>/<repo>/super-linter-lean:latest                      moves with each rebuild
#   ghcr.io/<owner>/<repo>/super-linter-lean:<upstream tag>              moves with each rebuild of that version
#   ghcr.io/<owner>/<repo>/super-linter-lean:<upstream tag>-<short sha>  immutable
#
# Optionally it points the SUPER_LINTER_CUSTOM_IMAGE repository variable (read by the
# super-linter workflow) at the immutable tag it just pushed. Writing a
# repository variable needs more than the workflow token, so this only happens
# when the VARIABLES_TOKEN secret exists (a token allowed to write Actions
# variables). Without it, set the variable once to the stable tag
# (ghcr.io/<owner>/<repo>/super-linter-lean:latest) and every rebuild, including a new
# upstream version, is picked up.
#
# Every push is signed with cosign (keyless, GitHub OIDC) and gets a SLSA build
# provenance attestation, both stored next to the image in GHCR. See
# docs/verifying-images.md for how to check them.
#
# It runs when the linter flags, the upstream pin or the generator change on
# main, or by hand. It never runs on a schedule: a new upstream release arrives
# through upstream-version.txt.

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - .github/super-linter.env
      - upstream-version.txt
      - src/lintsmith/**
      - action.yml
      - .github/workflows/self-image.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned upstream version
        id: pin
        run: echo "tag=$(tr -d '[:space:]' < upstream-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image and smoke-test it
        id: lean
        uses: ./ # zizmor: ignore[self-repository] actionlint rejects the $/ syntax
        with:
          upstream-tag: ${{ steps.pin.outputs.tag }}

      - name: Push the image
        id: build
        env:
          TAG: ${{ steps.pin.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          LOCAL_IMAGE: ${{ steps.lean.outputs.image }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/super-linter-lean"
          for tag in latest "${TAG}" "${TAG}-${SHA::7}"; do
            docker tag "${LOCAL_IMAGE}" "${image}:${tag}"
            docker push --quiet "${image}:${tag}"
          done
          digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${image}:${TAG}-${SHA::7}" \
            | sed -n "s|^${image}@||p" | head -n 1)"
          echo "Pushed \`${image}:${TAG}-${SHA::7}\` (\`${digest}\`)" >> "${GITHUB_STEP_SUMMARY}"
          {
            echo "image=${image}:${TAG}-${SHA::7}"
            echo "repository=${image}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          REPOSITORY: ${{ steps.build.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REPOSITORY}@${DIGEST}"

      - name: Attach build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Point SUPER_LINTER_CUSTOM_IMAGE at the new image
        env:
          GH_TOKEN: ${{ secrets.VARIABLES_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "VARIABLES_TOKEN is not set; leaving SUPER_LINTER_CUSTOM_IMAGE as it is." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          gh variable set SUPER_LINTER_CUSTOM_IMAGE --body "${IMAGE}"
          echo "SUPER_LINTER_CUSTOM_IMAGE is now \`${IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
