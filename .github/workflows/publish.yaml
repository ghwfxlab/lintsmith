---
name: Publish to PyPI

# Publishes a release to PyPI with trusted publishing (no token is stored).
#
#   release: published   works when the release was created with a GitHub App or
#                        personal token. A release created with GITHUB_TOKEN
#                        (the auto-release fallback when GH_APP_ID and
#                        GH_APP_PRIVATE_KEY are not set) does not start this.
#   workflow_dispatch    publish an existing release by tag, for example v0.0.5.
#
# The pypi environment has a required reviewer: that approval is the last check
# before a version goes out, and PyPI never accepts the same version twice.

on: # yamllint disable-line rule:truthy
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.0.5
        required: true

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build Distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout The Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0 # hatch-vcs derives the version from tags
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # avoid cache poisoning in a release-triggered publish

      - name: Build sdist and wheel
        run: uv build

      - name: Check that the build is the release version
        run: |
          ls dist
          if [ -n "${TAG}" ]; then
            test -f "dist/lintsmith-${TAG#v}.tar.gz" \
              || { echo "::error::dist does not contain version ${TAG#v}; refusing to publish a development build."; exit 1; }
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/project/lintsmith/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
