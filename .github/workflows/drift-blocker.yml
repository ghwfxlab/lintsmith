---
name: Lean image drift blocker

# Reusable workflow. Fails a pull request that adds files the repository's lean
# Super-Linter image does not lint, because the linters for them are not enabled.
#
# Use it from a pull_request workflow in the repository that has the Super-Linter
# workflow:
#
#   jobs:
#     drift:
#       permissions:
#         contents: read
#       uses: ghwfxlab/lintsmith/.github/workflows/drift-blocker.yml@main
#       with:
#         workflow: .github/workflows/linter.yml
#
# It runs on a GitHub-hosted runner by default. It never runs repository code:
# it reads the Super-Linter workflow and the list of changed files.

on:
  workflow_call:
    inputs:
      workflow:
        description: Workflow file that contains the super-linter step
        type: string
        required: true
      allow_ext:
        description: Space-separated file extensions or names you do not lint (for example "txt lock")
        type: string
        default: ""
      warn_only:
        description: Report problems without failing the check
        type: boolean
        default: false
      tool_ref:
        description: Ref of lintsmith to use
        type: string
        default: main
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  drift:
    name: Lean image drift
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ghwfxlab/lintsmith
          ref: ${{ inputs.tool_ref }}
          path: .lean-tool
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check changed files against the Super-Linter configuration
        env:
          WORKFLOW: ${{ inputs.workflow }}
          ALLOW_EXT: ${{ inputs.allow_ext }}
          WARN_ONLY: ${{ inputs.warn_only }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=(--workflow "$WORKFLOW" --root .)
          for e in $ALLOW_EXT; do args+=(--allow-ext "$e"); done
          [ "$WARN_ONLY" = "true" ] && args+=(--warn-only)
          if [ -n "$BASE_REF" ]; then
            # fetch-depth 0 above already fetched every branch
            args+=(--base "origin/$BASE_REF")
          else
            args+=(--base "HEAD~1")
          fi
          set +e
          uv run --project .lean-tool --no-dev lintsmith drift "${args[@]}" --report drift.md
          rc=$?
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
