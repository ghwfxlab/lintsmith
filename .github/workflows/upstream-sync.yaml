---
name: Upstream sync

# Keeps src/lintsmith/data/linters.json in step with upstream Super-Linter.
#
# Nothing here does work on upstream's behalf unless upstream has a newer
# release than the one pinned in upstream-version.txt:
#
#   detect    scheduled and manual runs: one GitHub API call that compares the
#             pinned version with the latest upstream release. Nothing else runs
#             when the pin is current.
#             A release must be at least UPSTREAM_COOLDOWN_DAYS old (repository
#             variable, default 0, like uv's exclude-newer): the newest release
#             that old is the target, and a younger one waits for a later run.
#   sync      only when upstream is ahead: add the linters that are missing from
#             the mapping (draft entries), build one image containing every
#             mapped linter to check them, bump the pin and open a pull request.
#             Merging that pull request starts the release workflow, which runs
#             the before/after benchmarks.
#   coverage  push and pull request only (a check on our own changes): the
#             mapping must cover every flag of the pinned upstream version.
#
# detect and coverage run on GitHub-hosted runners (coverage also runs for pull
# requests, which must never run on the self-hosted runner). sync needs docker
# with buildx, uv (installed by the workflow), jq, git and gh (a GitHub-hosted runner has them all).
# The pull request is opened with the SYNC_PR_TOKEN secret (a fine-grained token
# with "Pull requests: write" on this repository), not with the workflow token.
# That keeps "Allow GitHub Actions to create and approve pull requests" off, and
# a pull request opened this way also starts the tests and the lint. Without the
# secret the workflow token is tried, which fails while that setting is off; the
# branch is still pushed.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      force_tag:
        description: Sync to this upstream tag even if it is not the latest (optional)
        required: false
        default: ""
      cooldown_days:
        description: Only consider releases at least this many days old (default - the UPSTREAM_COOLDOWN_DAYS repository variable, else 0)
        required: false
        default: ""
      runner_labels:
        description: JSON array of runner labels for the sync job (default - the RUNNER_LABELS repository variable, else ubuntu-latest)
        default: ""
        required: false
  pull_request:
    paths:
      - src/**
      - pyproject.toml
      - upstream-version.txt
      - .github/workflows/upstream-sync.yaml
  push:
    branches: [main]
    paths:
      - src/**
      - upstream-version.txt

permissions: {}

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Mapping covers the pinned upstream version
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pin
        run: echo "pinned=$(tr -d '[:space:]' < upstream-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: super-linter/super-linter
          ref: ${{ steps.pin.outputs.pinned }}
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            lib
            dependencies
            test/linters

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Compare the mapping with upstream
        env:
          PINNED: ${{ steps.pin.outputs.pinned }}
        run: |
          set +e
          uv run lintsmith sync-mapping --upstream upstream --report coverage.md
          rc=$?
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::src/lintsmith/data/linters.json does not match upstream ${PINNED}. See the job summary."
            exit 1
          fi

  detect:
    name: Is upstream ahead of the pinned version?
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pinned: ${{ steps.v.outputs.pinned }}
      latest: ${{ steps.v.outputs.latest }}
      behind: ${{ steps.v.outputs.behind }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - id: v
        env:
          FORCE_TAG: ${{ inputs.force_tag }}
          COOLDOWN_DAYS: ${{ inputs.cooldown_days || vars.UPSTREAM_COOLDOWN_DAYS || '0' }}
        run: |
          status=0
          uv run --no-dev lintsmith select-upstream --pinned-file upstream-version.txt \
            --force-tag "$FORCE_TAG" --cooldown-days "$COOLDOWN_DAYS" > select.log || status=$?
          tee -a "$GITHUB_STEP_SUMMARY" < select.log
          exit "$status"

  sync:
    name: Sync to a newer upstream release
    needs: detect
    if: needs.detect.outputs.behind == 'true'
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PINNED: ${{ needs.detect.outputs.pinned }}
      TAG: ${{ needs.detect.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the new upstream release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: super-linter/super-linter
          ref: ${{ needs.detect.outputs.latest }}
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            lib
            dependencies

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Add missing linters to the mapping
        run: |
          set +e
          uv run lintsmith sync-mapping --upstream upstream --write --report sync-report.md
          cat sync-report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Build an image with every mapped linter and run the tool checks
        continue-on-error: true
        run: |
          docker system prune -af >/dev/null 2>&1 || true
          uv run lintsmith generate --all --upstream-tag "$TAG" \
            --upstream-dockerfile upstream/Dockerfile --out build-all
          docker buildx build build-all --provenance=false --sbom=false --load -t lean-all:check
          docker run --rm -v "$PWD/build-all/checks.sh:/checks.sh:ro" --entrypoint bash \
            lean-all:check /checks.sh 2>&1 | tee checks-all.log

      - name: Smoke-test the image with every mapped linter
        continue-on-error: true
        timeout-minutes: 120
        run: |
          status=0
          uv run lintsmith smoke lean-all:check build-all/plan.json upstream --jobs 4 > smoke-all.md || status=$?
          {
            echo "### Smoke test: every mapped linter on upstream's good and bad fixtures"
            echo
            cat smoke-all.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Open a pull request
        env:
          PR_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
        run: |
          echo "$TAG" > upstream-version.txt
          branch="sync/upstream-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$branch"
          git add upstream-version.txt src/lintsmith/data/linters.json
          git commit -q -m "chore: sync mapping with upstream ${TAG}"
          # the checkout keeps no credentials; give git the token for this push only
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push -f origin "$branch"
          {
            echo "Syncs the mapping with upstream Super-Linter ${TAG} (was ${PINNED})."
            echo
            echo "Merging this pull request starts the release workflow: it benchmarks the new version and publishes release notes with the before and after numbers."
            echo
            cat sync-report.md
            echo
            echo "### Tool checks on an image with every mapped linter"
            echo
            if [ -f checks-all.log ]; then
              echo "Failed: $(grep -c '^FAIL' checks-all.log || true)"
              echo '```'
              grep -E '^(FAIL|    )' checks-all.log | head -60 || true
              echo '```'
            else
              echo "The image did not build. See the workflow run."
            fi
            echo
            echo "### Smoke test on an image with every mapped linter"
            echo
            if [ -f smoke-all.md ]; then
              echo "Linters that did not lint the upstream fixtures correctly: $(grep -c 'FAIL' smoke-all.md || true)"
              echo '```'
              grep 'FAIL' smoke-all.md | head -60 || true
              echo '```'
            else
              echo "The smoke test did not run. See the workflow run."
            fi
            echo
            echo "Draft entries are verified only by their tool check and smoke test. Review them before merging."
          } > pr-body.md
          if [ -z "${PR_TOKEN}" ]; then
            echo "::warning::SYNC_PR_TOKEN is not set; opening the pull request with the workflow token."
          fi
          GH_TOKEN="${PR_TOKEN:-$GH_TOKEN}" gh pr create --base main --head "$branch" \
            --title "chore: sync mapping with upstream ${TAG}" --body-file pr-body.md \
            || echo "::warning::could not open a pull request. The branch $branch was pushed."
