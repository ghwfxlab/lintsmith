[project]
name = "lintsmith"
dynamic = ["version"]
description = "Lean, tailored Super-Linter images: only the linters you enable, plus any extra tools you need."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]
authors = [{ name = "Peter Meyer Elphick Frandsen" }]
keywords = ["super-linter", "github-actions", "docker", "ci-cd", "linting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov>=6.0"]
lint = ["ruff>=0.4"]
typecheck = ["mypy>=1.10", "types-PyYAML>=6.0"]
build = ["build>=1.0"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "build" },
]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "7 days"

[project.scripts]
lintsmith = "lintsmith.cli:main"

[project.urls]
Homepage = "https://github.com/ghwfxlab/lintsmith"
Repository = "https://github.com/ghwfxlab/lintsmith"
Issues = "https://github.com/ghwfxlab/lintsmith/issues"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/lintsmith"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lintsmith --cov-report=term-missing --cov-report=xml --junitxml=junit.xml"
junit_family = "legacy"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "S", "UP", "RUF", "N"]
# long lines are mostly embedded shell and Dockerfile text
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# drift shells out to git with a fixed argument list
"src/lintsmith/drift.py" = ["S603", "S607"]
# smoke runs git and docker with fixed argument lists
"src/lintsmith/smoke.py" = ["S603", "S607"]
# bench runs docker and crane with fixed argument lists
"src/lintsmith/bench.py" = ["S603", "S607"]
# upstream runs gh with a fixed argument list
"src/lintsmith/upstream.py" = ["S603", "S607"]
# repository_settings runs gh with a fixed argument list
"src/lintsmith/repository_settings.py" = ["S603", "S607"]
"tests/*" = ["S101", "S105", "S106", "S108", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
